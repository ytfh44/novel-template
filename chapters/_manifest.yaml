# 章节清单 & Commit 状态
# 由 /novel-write 维护

# Commit 规则:
#   - committed: 章节已定稿, 在 refine 时只可参照不可修改
#   - uncommitted: 章节为草稿, 可被修改和重写
#   - 使用 /novel-write commit <chapter> 或 uncommit <chapter> 切换状态

chapters:
